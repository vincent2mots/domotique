## Inversion des volets (souci lié à Tuya)

### ETAGE

# Volet étage bureau
  - device_class: shutter
    open_cover:
    - target:
        entity_id:
        - cover.volet_bureau_etage_rideau
      action: cover.open_cover
    close_cover:
    - target:
        entity_id:
        - cover.volet_bureau_etage_rideau
      action: cover.close_cover
    set_cover_position:
    - data:
        entity_id: cover.volet_bureau_etage_rideau
        position: '{{ 100 - position }}'
      action: cover.set_cover_position
    default_entity_id: cover.volet_etage_corrige
    name: Volet bureau étage
    position: '{{ 100 - state_attr(''cover.volet_bureau_etage_rideau'', ''current_position'')| int }}'

